server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing, so a direct load or refresh on a
    # route like /catalog/:id has no matching file on disk — fall back to
    # index.html and let the router handle it.
    location / {
        try_files $uri /index.html;
    }
}
