# Render Blueprint — deploys the whole system on Render's free tier.
#
# All 6 services use `plan: free`. Private Services have no free tier at all,
# and — critically — Render confirms free WEB services can only *send*
# private-network requests, never *receive* them. Since every backend service
# here needs to receive calls from api-gateway (and order-service needs to
# call user-service/catalog-service), private networking isn't usable on the
# free plan for this topology at all, regardless of service type.
#
# So inter-service calls go over each service's public https://...onrender.com
# URL instead — same as any two unrelated services talking over the internet.
# The existing INTERNAL_SERVICE_KEY check in every service's
# internalAuthMiddleware is the actual defense against someone hitting a
# backend service's public URL directly; that check doesn't care which
# network the request arrived over, so this loses no real security compared
# to the internal-hostname approach — only the "traffic never leaves Render's
# network" nicety, which cost money anyway.
#
# Practical consequence: every *_SERVICE_URL value below has to be filled in
# manually (sync: false) with the real public URL Render assigns each service,
# since there's no way to know that URL before the service is first created.
# One-time setup after the initial deploy:
#   1. Deploy this blueprint once — every *_SERVICE_URL will be empty/unset,
#      so inter-service calls will fail. That's expected on this first pass.
#   2. Copy each backend service's public URL from its own dashboard page.
#   3. Go to every service that references another one below (see comments)
#      and set its *_SERVICE_URL env var to that service's real URL, e.g.
#      USER_SERVICE_URL = https://user-service-xxxx.onrender.com
#      (no trailing slash, no port — Render serves everything over HTTPS/443).
#   4. Manually redeploy each service you just edited.
#
# Ports are fixed to match what's already hardcoded in the code (each
# service's own PORT fallback default) — 3000-3004, same as local dev.
#
# Secrets (sync: false) are NOT set here — fill them in once in the Render
# Dashboard after the first deploy. Nothing sensitive is committed.

services:
  - type: web
    name: api-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./services/api-gateway/Dockerfile
    dockerContext: ./services/api-gateway
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_SERVICE_KEY
        sync: false
      - key: VALKEY_URL
        sync: false
      # Fill in with each service's public URL after it's first deployed —
      # see the setup steps in the file header comment above.
      - key: USER_SERVICE_URL
        sync: false
      - key: CATALOG_SERVICE_URL
        sync: false
      - key: ORDER_SERVICE_URL
        sync: false
      - key: NOTIFICATION_SERVICE_URL
        sync: false

  - type: web
    name: user-service
    runtime: docker
    plan: free
    dockerfilePath: ./services/user-service/Dockerfile
    dockerContext: ./services/user-service
    envVars:
      - key: PORT
        value: 3001
      - key: USER_SERVICE_PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_SERVICE_KEY
        sync: false

  - type: web
    name: catalog-service
    runtime: docker
    plan: free
    dockerfilePath: ./services/catalog-service/Dockerfile
    dockerContext: ./services/catalog-service
    envVars:
      - key: PORT
        value: 3002
      - key: CATALOG_SERVICE_PORT
        value: 3002
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: VALKEY_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: INTERNAL_SERVICE_KEY
        sync: false

  - type: web
    name: order-service
    runtime: docker
    plan: free
    dockerfilePath: ./services/order-service/Dockerfile
    dockerContext: ./services/order-service
    envVars:
      - key: PORT
        value: 3003
      - key: ORDER_SERVICE_PORT
        value: 3003
      - key: DATABASE_URL
        sync: false
      - key: VALKEY_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: INTERNAL_SERVICE_KEY
        sync: false
      # Fill in with user-service's / catalog-service's public URLs — same
      # one-time step as api-gateway above.
      - key: USER_SERVICE_URL
        sync: false
      - key: CATALOG_SERVICE_URL
        sync: false

  - type: web
    name: notification-service
    runtime: docker
    plan: free
    dockerfilePath: ./services/notification-service/Dockerfile
    dockerContext: ./services/notification-service
    envVars:
      - key: PORT
        value: 3004
      - key: NOTIFICATION_SERVICE_PORT
        value: 3004
      - key: DATABASE_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_SERVICE_KEY
        sync: false
      # Fill in with order-service's public URL — same one-time step as above.
      - key: ORDER_SERVICE_URL
        sync: false

  # Static Site, not the nginx Dockerfile — free and never spins down (unlike
  # the free Web Services above, which sleep after 15 idle minutes). Nothing
  # to run for pure static output, so there's no reason to pay the cold-start
  # cost here too.
  - type: web
    name: frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Baked in at build time (Vite can't read env vars at runtime) — the
      # browser calls this directly, so it must be api-gateway's PUBLIC URL.
      # Fill in after api-gateway is first deployed, then manually redeploy
      # just this service.
      - key: VITE_API_BASE_URL
        sync: false
